name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Mobile Tests
        run: |
          cd mobile
          npm install
          npm test -- --coverage
      - name: Backend Tests
        run: |
          cd backend
          npm install
          npm test -- --coverage
